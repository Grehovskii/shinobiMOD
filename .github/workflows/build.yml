name: Build mod

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle wrapper jar if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sSL -o gradle-8.1.1-bin.zip https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
            unzip -q gradle-8.1.1-bin.zip
            rm -f gradlew gradlew.bat
            ./gradle-8.1.1/bin/gradle wrapper --gradle-version 8.1.1
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload built mod jar
        uses: actions/upload-artifact@v4
        with:
          name: shinobimod-jar
          path: build/libs/*.jar

      # The artifacts API serves binaries from Azure Blob Storage, which some
      # sandboxed clients (e.g. a locked-down egress proxy) can't reach.
      # Committing the jar straight into the repo makes it fetchable with a
      # plain `git pull`/`git show`, no blob storage involved.
      - name: Publish jar to dist/ on the build-output branch
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/dist"
          cp build/libs/*.jar "$RUNNER_TEMP/dist/"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin build-output 2>/dev/null || true
          # Use a separate worktree so the main checkout (which the wrapper
          # step has already modified) is left alone.
          rm -rf "$RUNNER_TEMP/bo"
          if git show-ref --verify --quiet refs/remotes/origin/build-output; then
            git worktree add -B build-output "$RUNNER_TEMP/bo" origin/build-output
          else
            git worktree add --orphan -b build-output "$RUNNER_TEMP/bo"
          fi
          cd "$RUNNER_TEMP/bo"
          mkdir -p dist
          rm -f dist/*.jar
          cp "$RUNNER_TEMP"/dist/*.jar dist/
          git add dist
          git commit -m "Build output for ${{ github.sha }}" --allow-empty
          git push origin build-output --force
